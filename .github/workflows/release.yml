# Builds the Windows app and publishes it as a GitHub Release when a version tag is pushed:
#   npm version 1.5.1 --no-git-tag-version --prefix desktop
#   git commit -am "Lamha 1.5.1" && git tag v1.5.1 && git push && git push origin v1.5.1
# Installed copies of Lamha find the new release through latest.yml (electron-updater).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release and upload the installers (this run's own, temporary token)

jobs:
  release:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22 # npm 10: runs packages' install scripts (npm 11 skips them)

      - name: The tag matches the app's version
        shell: bash
        run: |
          version=$(node -p "require('./desktop/package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match desktop/package.json version $version"
            exit 1
          fi

      - name: Tests and extension lint
        run: |
          npm ci
          npm test
          npx --yes web-ext@10.7.0 lint --warnings-as-errors

      # One draft release up front: electron-builder's parallel uploads would otherwise each create their own
      # release for the tag, and GitHub would serve downloads from one that lacks the installer / latest.yml.
      - name: Create the draft release
        shell: bash
        run: gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "Lamha ${GITHUB_REF_NAME#v}" --generate-notes

      - name: Build and upload the installers
        working-directory: desktop
        run: |
          npm ci
          npm run release

      - name: Publish the release
        shell: bash
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest

      - name: Installed copies can see it
        shell: bash
        run: |
          url="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/latest.yml"
          for i in 1 2 3 4 5 6; do
            if curl -sfL "$url" | grep -q "version: ${GITHUB_REF_NAME#v}"; then echo "OK: $url"; exit 0; fi
            sleep 10
          done
          echo "::error::$url does not serve version ${GITHUB_REF_NAME#v}"
          exit 1
