# Runs Lamha 2's tests (legacy/) when its code changes. Lamha 3 ports their behaviour, so they must keep passing
# until the port is finished. Lamha 2's own releases are built from the release/2.x branch, with its own workflows.
name: Checks (Lamha 2)

on:
  push:
    branches: [main]
    paths: ["legacy/**", ".github/workflows/legacy-checks.yml"]
  pull_request:
    paths: ["legacy/**", ".github/workflows/legacy-checks.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: legacy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
