# Publishes the website (site/) to GitHub Pages: https://osamaomer.github.io/lamha/
# Its "What's new" reads shared/changelog.js, copied next to the page here, so a changelog edit updates the site too.
# The download buttons ask GitHub for the latest release when the page opens: a release needs no change here.
# Once, in the repository: Settings → Pages → Source: GitHub Actions.
name: Website

on:
  push:
    branches: [main]
    paths: ["site/**", "shared/changelog.js", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write # publish to Pages
  id-token: write # the deploy action proves where it runs

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: The site, with the changelog
        run: |
          mkdir _site
          cp -r site/. _site/
          cp shared/changelog.js _site/

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
