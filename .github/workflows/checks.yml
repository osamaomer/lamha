# Runs the tests and the extension lint on every push and pull request.
# (The desktop self-test, npm run smoke, needs a real Windows desktop: run it on your PC before a release.)
name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npx --yes web-ext@10.7.0 lint --warnings-as-errors
