<!DOCTYPE html>
<!-- Lamha desktop: the clipboard history quick panel (Alt+Shift+V). main.js injects shared/ui.css, clipboard.css,
     shared/arabic-normalize.js, clip-list.js and panel.js into it, and reuses the window (created hidden at startup). -->
<html lang="ar" dir="rtl" class="cp-page">
<head>
  <meta charset="utf-8">
  <title>الحافظة — لمحة</title>
</head>
<body>
  <main class="cp" aria-label="الحافظة">
    <header class="cp-head"><strong>الحافظة</strong><span>اختر نصًا لتلصقه</span></header>
    <section id="cpBody" class="cp-body"></section>
    <footer class="cp-foot" id="cpFoot">
      <span><kbd>Enter</kbd> لصق</span>
      <span><span class="combo"><kbd>Shift</kbd>+<kbd>Enter</kbd></span> نص عادي</span>
      <span><span class="combo"><kbd>Ctrl</kbd>+<kbd>P</kbd></span> تثبيت</span>
      <span><kbd>Tab</kbd> أدوات</span>
      <span><kbd>Delete</kbd> حذف</span>
      <span><kbd>Esc</kbd> إغلاق</span>
    </footer>
  </main>
</body>
</html>
