<!DOCTYPE html>
<!-- Lamha desktop: the clipboard history quick panel (Alt+Shift+V). main.js injects shared/ui.css, clipboard.css,
     shared/arabic-normalize.js, clip-list.js and panel.js into it, and reuses the window (created hidden at startup). -->
<html lang="ar" dir="rtl" class="cp-page" data-i18n-pending>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'none'; media-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
  <title data-i18n="d.panelTitle">الحافظة — لمحة</title>
</head>
<body>
  <main class="cp" aria-label="الحافظة" data-i18n-attr="aria-label:d.panelLabel">
    <header class="cp-head"><strong data-i18n="d.panelLabel">الحافظة</strong><span data-i18n="d.panelHint">اختر نصًا لتلصقه</span></header>
    <section id="cpBody" class="cp-body"></section>
    <!-- the keys you need most, on one line; Pin (Ctrl+P) and Delete are in the row buttons' tooltips -->
    <footer class="cp-foot" id="cpFoot">
      <span><kbd>Enter</kbd> <span data-i18n="d.kPaste">لصق</span></span>
      <span><span class="combo"><kbd>Shift</kbd>+<kbd>Enter</kbd></span> <span data-i18n="d.kPlain">نص عادي</span></span>
      <span><kbd>Tab</kbd> <span data-i18n="d.kTools">أدوات</span></span>
      <span><kbd>Esc</kbd> <span data-i18n="d.kClose">إغلاق</span></span>
    </footer>
  </main>
</body>
</html>
