<!DOCTYPE html>
<!-- Lamha desktop: the Wikipedia reader (downloaded .zim files). main.js injects the shared scripts, sanitize.js,
     reader.js and the content scripts. The policy below is a second wall behind the sanitizer: no script from anywhere
     but Lamha, no requests, pictures only from lamha-wiki: (the files) and the card's own sources. -->
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' lamha-wiki: data: https:; font-src 'self' data:; connect-src 'none'; media-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ويكيبيديا — لمحة</title>
  <link rel="stylesheet" href="reader.css">
</head>
<body>
  <div id="app"></div>
</body>
</html>
